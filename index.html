<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

    <script src="scripts/templates.js"></script>
    <script src="scripts/buttons.js"></script>
    <script src="script.js"></script>

    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="style.css">

</head>

<body onload="init()">
    <header>
        <h1>Pokedex</h1>
    </header>

    <main>
        <section id="list_view">
            <div id="single_list_card" class="single_list_card bug" onclick="openDialog()">
            </div>

        </section>


        <dialog id="dialog" class="bug" onclick="closeDialog()">
            <button class="next_previous_button" id="previous"><</button>
            <button class="next_previous_button" id="next">></button>

            <section id="single_pokemon_overlay" onclick="preventCloseDialogOnDialog(event)">
            </section>
        </dialog>

    </main>

    <footer>
        <span>Monika Weikum | 2026</span>
    </footer>

</body>

</html>
