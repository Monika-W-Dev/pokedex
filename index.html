<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

    <script src="script.js"></script>

    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>Pokedex</h1>
    </header>

    <main>
        <section id="list_view">
            <div id="single_list_card" class="single_list_card bug" onclick="openDialog()">
                <span id="pokemon_id">#1</span>
                <img id="pokemon_image"
                    src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/1.svg"
                    alt="Bulbasaur">
                <span id="pokemon_name">BULBASAUR</span>
                <div id="pokemon_types">
                    <div id="pokemon_type" class="grass">
                        grass
                    </div>
                    <div id="pokemon_type" class="poison">
                        poison</div>
                </div>
            </div>




        </section>


        <dialog id="dialog" class="bug" onclick="closeDialog()">
            <section id="single_pokemon_overlay" onclick="preventCloseDialogOnDialog(event)">

                <div id="single_pokemon_info_top">
                    <img id="pokemon_image"
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/1.svg"
                        alt="Bulbasaur">
                    <span id="pokemon_name">BULBASAUR</span>
                    <div id="pokemon_types">
                        <div id="pokemon_type" class="grass">
                            grass
                        </div>
                        <div id="pokemon_type" class="poison">
                            poison</div>
                    </div>
                </div>

                <div id="single_pokemon_info_buttom">
                    <div id="card_taps">
                        <button id="about" class="card_tap">About</button>
                        <button id="base_stats" class="card_tap">Base Stats</button>
                        <button id="evolution" class="card_tap">Evolution</button>
                    </div>
                    <div class="info_section">

                        <!-- <table class="info_about">
                            <tbody>
                                <tr>
                                    <td>Height</td>
                                    <td>170</td>
                                </tr>
                                <tr>
                                    <td>Weight</td>
                                    <td>70</td>
                                </tr>
                                <tr>
                                    <td>Abilities</td>
                                    <td>Blaze, Solar</td>
                                </tr>
                            </tbody>
                        </table> -->

                        <table class="info_base_stats">
                            <tbody>
                                <tr>
                                    <td>HP</td>
                                    <td>45</td>
                                    <td>
                                        <div class="progress-bar-container">
                                            <div class="progress-bar-fill">
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Attack&nbsp;&nbsp;</td>
                                    <td>65</td>
                                    <td>
                                        <div class="progress-bar-container">
                                            <div class="progress-bar-fill">
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Defense</td>
                                    <td>48</td>
                                    <td>
                                        <div class="progress-bar-container">
                                            <div class="progress-bar-fill">
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Special-Attack</td>
                                    <td>22</td>
                                    <td>
                                        <div class="progress-bar-container">
                                            <div class="progress-bar-fill">
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Special-Defense</td>
                                    <td>30</td>
                                    <td>
                                        <div class="progress-bar-container">
                                            <div class="progress-bar-fill">
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Speed</td>
                                    <td>45</td>
                                    <td>
                                        <div class="progress-bar-container">
                                            <div class="progress-bar-fill">
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>


                    </div>
                </div>

            </section>
        </dialog>

    </main>


    <footer>
        <span>Monika Weikum | 2026</span>
    </footer>

</body>

</html>
