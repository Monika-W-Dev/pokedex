<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

    <script src="scripts/templates.js"></script>
    <script src="scripts/buttons.js"></script>
    <script src="script.js"></script>

    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="style.css">

</head>

<body onload="init()">
    <header>
        <h1>Pokedex</h1>

        <search>
            <input id="input" type="text" value="" required placeholder="search a Pokemon">
            <div class="search_buttons">
                <button class="search_section_button" id="search_button" onclick="searchPokemon()">Search</button>
                <button class="search_section_button refresh" id="refresh_button" title="refresh"
                    onclick="refresh()">&#8635;</button>
            </div>
        </search>
    </header>
    <span id="faulty_input" style="display: none;"></span>

    <main>
        <section id="list_view">
            <div id="single_list_card" class="single_list_card" onclick="openDialog()">
            </div>

        </section>


        <dialog id="dialog" class="" onclick="closeDialog()">
            <section id="single_pokemon_overlay" onclick="preventCloseDialogOnDialog(event)">
            </section>
        </dialog>

        <div id="load_more_section" style="display: none">
            <button class="load_more_button" onclick="fetchData()"><img src="/assets/img/LoadMore.png" alt=""></button>
        </div>
    </main>

    <div id="loading_spin" style="display: none">
        <img class="rotating" src="/assets/img/waiting.png" alt="">
    </div>

    <footer>
        <span>Monika Weikum | 2026</span>
    </footer>

</body>

</html>
